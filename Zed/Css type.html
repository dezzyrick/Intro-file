<!DOCTYPE html>
<html>
<head>
    <title>My Picture Card</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 300px;
            background-color: white;
            margin: 100px auto;
            padding: 100px;
            text-align: center;
            border: 2px solid black;
            border-radius: 10px;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card h2 {
            color: darkblue;
        }

        .card p {
            color: gray;
        }
        
    </style>
</head>

<body>

    <div class="card">

        <img src="images/images (4).jpg"alt="Hello my name is GTR">

        <h2>My name is GTR</h2>

        <p>
            This the GTR who are from tokyo drift that can be use for racing, So far this is the best car that can run faster.
        </p>

    </div>

</body>
</html>
